<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" aria-labelledby="title desc"><title id="title">一条意愿，怎样查回原话？</title><desc id="desc">沿同一个编号查条件，再沿“依据”回到问卷。</desc><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="960" height="370" rx="14" fill="#faf6ee"/><text x="38" y="42" font-size="17" font-weight="600" fill="#8b4c37">嘉宾资料手记   /   教学示例</text><text x="38" y="90" font-size="34" font-weight="700" fill="#193e40">一条意愿，怎样查回原话？</text><text x="38" y="128" font-size="20" font-weight="400" fill="#193e40">沿同一个编号查条件，再沿“依据”回到问卷。</text><rect x="38" y="166" width="220" height="168" rx="14" fill="#e0ece6"/><text x="56" y="200" font-size="24" font-weight="600" fill="#193e40">谁表达的？</text><text x="56" y="238" font-size="20" font-weight="400" fill="#193e40">林遥</text><text x="56" y="315" font-size="16" font-weight="400" fill="#8b4c37">表达者</text><text x="264" y="253" font-size="26" font-weight="400" fill="#193e40">←</text><rect x="302" y="166" width="340" height="168" rx="14" fill="#e0ece6"/><text x="320" y="200" font-size="24" font-weight="600" fill="#193e40">同行意愿 D-1</text><text x="320" y="238" font-size="20" font-weight="400" fill="#193e40">爬山  /  周末  /  路程较短</text><text x="320" y="315" font-size="16" font-weight="400" fill="#8b4c37">活动、时段、路线</text><text x="649" y="253" font-size="26" font-weight="400" fill="#193e40">→</text><rect x="686" y="166" width="235" height="168" rx="14" fill="#e0ece6"/><text x="704" y="200" font-size="24" font-weight="600" fill="#193e40">依据在哪里？</text><text x="704" y="238" font-size="20" font-weight="400" fill="#193e40">问卷 D · 第 1 版</text><text x="704" y="315" font-size="16" font-weight="400" fill="#8b4c37">位置：问卷答语</text></g></svg>
