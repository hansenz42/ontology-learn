<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="title desc">
  <title id="title">Agent 怎样回答借书问题</title>
  <desc id="desc">模型借助参数里的常识理解提问。检索工具查找馆方的办证指南和公告，把原文交给模型，模型再依据原文答复。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L9 5 L0 10 Z" fill="#29516a"/></marker>
  </defs>
  <style>
    text { font-family: "PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#173b50 }
    .head { font-size:26px; font-weight:bold } .body { font-size:20px } .label { font-size:22px; font-weight:bold }
    .flow { fill:none; stroke:#29516a; stroke-width:3; marker-end:url(#arrow) }
  </style>
  <rect width="960" height="530" rx="20" fill="#faf8f0"/>
  <g transform="translate(28 35)">
    <text class="label" y="20">你的提问</text>
    <text class="head" y="64">“第一次办证要带什么？四点二十到，还来得及借书吗？”</text>
  </g>
  <path class="flow" d="M166 117 V155"/>
  <g fill="#fff" stroke="#91a8ac" stroke-width="2">
    <rect x="28" y="164" width="276" height="152" rx="14"/>
    <rect x="342" y="164" width="276" height="152" rx="14"/>
    <rect x="656" y="164" width="276" height="152" rx="14"/>
  </g>
  <path class="flow" d="M306 238 H335"/><path class="flow" d="M620 238 H649"/>
  <g class="head">
    <text x="48" y="209">1　理解问题</text><text x="362" y="209">2　检索资料</text><text x="676" y="209">3　依据原文答复</text>
  </g>
  <g class="body">
    <text x="48" y="251">先办证，再借书。</text><text x="48" y="282">两项服务都得查。</text>
    <text x="362" y="251">查办证要求和当天安排，</text><text x="362" y="282">把相关原文交给模型。</text>
    <text x="676" y="251">说明该带什么、几点停借，</text><text x="676" y="282">哪些时间还要确认。</text>
  </g>
  <path class="flow" d="M166 381 V324"/><path class="flow" d="M480 381 V324"/>
  <g>
    <rect x="28" y="386" width="380" height="114" rx="14" fill="#e5edf4"/>
    <text class="label" x="48" y="427">内部知识 · 模型参数里的常识</text>
    <text class="body" x="48" y="468">例如，办证通常要核对身份。</text>
    <rect x="430" y="386" width="502" height="114" rx="14" fill="#deeee5"/>
    <text class="label" x="450" y="427">外部知识 · 馆方发布的资料</text>
    <text class="body" x="450" y="468">办证指南、开放时间表和周末服务公告。</text>
  </g>
</svg>
