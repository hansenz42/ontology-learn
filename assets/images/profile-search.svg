<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 382" role="img" aria-labelledby="title desc"><title id="title">从自我介绍追到问卷</title><desc id="desc">如果只找到 B，下一次查询就用嘉宾姓名和问卷标题。</desc><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="960" height="382" rx="14" fill="#faf6ee"/><text x="38" y="42" font-size="17" font-weight="600" fill="#8b4c37">嘉宾资料手记   /   教学示例</text><text x="38" y="90" font-size="34" font-weight="700" fill="#193e40">从自我介绍追到问卷</text><text x="38" y="128" font-size="20" font-weight="400" fill="#193e40">如果只找到 B，下一次查询就用嘉宾姓名和问卷标题。</text><rect x="38" y="158" width="388" height="183" rx="14" fill="#e0ece6"/><text x="56" y="192" font-size="24" font-weight="600" fill="#193e40">B   林遥的自我介绍</text><text x="56" y="230" font-size="20" font-weight="400" fill="#193e40">“想一起做什么，我写在</text><text x="56" y="264" font-size="20" font-weight="400" fill="#193e40">《周末同行小问卷》里了。”</text><text x="56" y="322" font-size="16" font-weight="400" fill="#8b4c37">线索：问卷名</text><text x="447" y="254" font-size="42" font-weight="400" fill="#a65338">→</text><rect x="520" y="158" width="402" height="183" rx="14" fill="#e0ece6"/><text x="538" y="192" font-size="24" font-weight="600" fill="#193e40">D   林遥的问卷</text><text x="538" y="230" font-size="20" font-weight="400" fill="#193e40">“我刚开始爬山，周末想找个伴</text><text x="538" y="264" font-size="20" font-weight="400" fill="#193e40">一起去，路别太长就好。”</text><text x="538" y="322" font-size="16" font-weight="400" fill="#8b4c37">证据：问卷答语</text></g></svg>
