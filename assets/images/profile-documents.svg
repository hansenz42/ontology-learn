<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 424" role="img" aria-labelledby="title desc"><title id="title">三位嘉宾，四份原件</title><desc id="desc">字母代表文档。B 和 D 属于同一个人，须分别登记。</desc><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="960" height="424" rx="14" fill="#faf6ee"/><text x="38" y="42" font-size="17" font-weight="600" fill="#8b4c37">嘉宾资料手记   /   教学示例</text><text x="38" y="90" font-size="34" font-weight="700" fill="#193e40">三位嘉宾，四份原件</text><text x="38" y="128" font-size="20" font-weight="400" fill="#193e40">字母代表文档。B 和 D 属于同一个人，须分别登记。</text><rect x="38" y="153" width="430" height="112" rx="14" fill="#e0ece6"/><text x="56" y="187" font-size="24" font-weight="600" fill="#193e40">A   陈澈 · 自我介绍</text><text x="56" y="225" font-size="20" font-weight="400" fill="#193e40">周六独自爬山也很好。</text><rect x="489" y="153" width="430" height="112" rx="14" fill="#e0ece6"/><text x="507" y="187" font-size="24" font-weight="600" fill="#193e40">B   林遥 · 自我介绍</text><text x="507" y="225" font-size="20" font-weight="400" fill="#193e40">提到自己填过一份问卷。</text><rect x="38" y="279" width="430" height="112" rx="14" fill="#e0ece6"/><text x="56" y="313" font-size="24" font-weight="600" fill="#193e40">C   周宁 · 自我介绍</text><text x="56" y="351" font-size="20" font-weight="400" fill="#193e40">以前常爬山，近两年更爱逛展。</text><rect x="489" y="279" width="430" height="112" rx="14" fill="#e0ece6"/><text x="507" y="313" font-size="24" font-weight="600" fill="#193e40">D   林遥 · 周末同行小问卷</text><text x="507" y="351" font-size="20" font-weight="400" fill="#193e40">写下对周末同行的期待。</text></g></svg>
