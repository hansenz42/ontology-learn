<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 365" role="img" aria-labelledby="title desc"><title id="title">一条请求怎样变成答复？</title><desc id="desc">从你按下发送，到手机收到有出处的答复。</desc><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="960" height="365" rx="14" fill="#faf6ee"/><text x="38" y="42" font-size="17" font-weight="600" fill="#8b4c37">嘉宾资料手记   /   教学示例</text><text x="38" y="90" font-size="34" font-weight="700" fill="#193e40">一条请求怎样变成答复？</text><text x="38" y="128" font-size="20" font-weight="400" fill="#193e40">从你按下发送，到手机收到有出处的答复。</text><rect x="38" y="160" width="209" height="166" rx="14" fill="#e0ece6"/><text x="53" y="191" font-size="16" fill="#193e40">01</text><text x="53" y="227" font-size="25" fill="#193e40">接收请求</text><text x="53" y="269" font-size="19" fill="#193e40">读到整段提问，</text><text x="53" y="298" font-size="19" fill="#193e40">也收到引用要求。</text><rect x="263" y="160" width="209" height="166" rx="14" fill="#e0ece6"/><text x="278" y="191" font-size="16" fill="#193e40">02</text><text x="278" y="227" font-size="25" fill="#193e40">分析请求</text><text x="278" y="269" font-size="19" fill="#193e40">分清你的情况和</text><text x="278" y="298" font-size="19" fill="#193e40">你对同伴的期待。</text><rect x="488" y="160" width="209" height="166" rx="14" fill="#e0ece6"/><text x="503" y="191" font-size="16" fill="#193e40">03</text><text x="503" y="227" font-size="25" fill="#193e40">搜索资料</text><text x="503" y="269" font-size="19" fill="#193e40">检索相关原文，</text><text x="503" y="298" font-size="19" fill="#193e40">必要时继续查。</text><rect x="713" y="160" width="209" height="166" rx="14" fill="#e0ece6"/><text x="728" y="191" font-size="16" fill="#193e40">04</text><text x="728" y="227" font-size="25" fill="#193e40">返回结果</text><text x="728" y="269" font-size="19" fill="#193e40">给出姓名和原话，</text><text x="728" y="298" font-size="19" fill="#193e40">说明哪些还未知。</text></g></svg>
