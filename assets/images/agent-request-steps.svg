<svg xmlns="http://www.w3.org/2000/svg" width="900" height="462" viewBox="0 0 900 462" role="img" aria-labelledby="title desc">
<title id="title">Agent 处理借书请求的四个步骤</title>
<desc id="desc">教学示例：先理解出行打算，再确定要查的事项，随后调用检索工具，最后核对原文并答复。</desc>
<style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#193b47}.step{font-size:25px;font-weight:650}.detail{font-size:20px}.number{font-size:24px;fill:white;font-weight:bold}</style>
<rect width="900" height="462" rx="16" fill="#faf8f1"/>
<text x="30" y="48" font-size="30" font-weight="bold">从借书提问到答复</text><text x="868" y="46" text-anchor="end" font-size="17">教学示例</text>
<rect x="86" y="77" width="783" height="78" rx="10" fill="white" stroke="#ccd7d4"/><circle cx="49" cy="115" r="21" fill="#24675f"/><text class="number" x="49" y="123" text-anchor="middle">1</text><text class="step" x="106" y="108">理解你的打算</text><text class="detail" x="106" y="138">四点二十到馆，想先办证，再借书。</text>
<path d="M49 139v40 m-6 -7 6 7 6 -7" fill="none" stroke="#50786f" stroke-width="3"/>
<rect x="86" y="172" width="783" height="78" rx="10" fill="white" stroke="#ccd7d4"/><circle cx="49" cy="210" r="21" fill="#24675f"/><text class="number" x="49" y="218" text-anchor="middle">2</text><text class="step" x="106" y="203">确定要查的事项</text><text class="detail" x="106" y="233">办证带什么？办证和借阅各到几点？</text>
<path d="M49 234v40 m-6 -7 6 7 6 -7" fill="none" stroke="#50786f" stroke-width="3"/>
<rect x="86" y="267" width="783" height="78" rx="10" fill="white" stroke="#ccd7d4"/><circle cx="49" cy="305" r="21" fill="#24675f"/><text class="number" x="49" y="313" text-anchor="middle">3</text><text class="step" x="106" y="298">调用检索工具</text><text class="detail" x="106" y="328">查之江馆区的办证指南、时间表和当天的公告。</text>
<path d="M49 329v40 m-6 -7 6 7 6 -7" fill="none" stroke="#50786f" stroke-width="3"/>
<rect x="86" y="362" width="783" height="78" rx="10" fill="white" stroke="#ccd7d4"/><circle cx="49" cy="400" r="21" fill="#24675f"/><text class="number" x="49" y="408" text-anchor="middle">4</text><text class="step" x="106" y="393">核对原文，给你答复</text><text class="detail" x="106" y="423">借阅到四点半。办证时间未查到，能否办完还不能确定。</text>
</svg>
