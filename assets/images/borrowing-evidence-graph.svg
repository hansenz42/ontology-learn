<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc"><title id="title">从原件到三元组，再到答复</title><desc id="desc">Agent 找到 A 到 D 四份材料。C-1 的六条三元组分别表达类型、馆区、服务、日期、截止时间和依据。结合 B、C、D 可以回答部分问题，办证截止和耗时仍未知。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#407570"/></marker></defs><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#203b39}</style><rect width="900" height="700" fill="#fcfaf4"/>
<text x="32" y="42" font-size="26">Agent 查找材料</text>
<text x="32" y="82" font-size="19">从 A 馆区主页追到 C 周末服务公告，再查 B 开放时间表和 D 办证指南。</text>
<text x="32" y="147" font-size="25">核对原文后，把公告 C 的安排写成三元组</text>
<rect x="35" y="310" width="196" height="57" rx="12" fill="#e2eae0"/>
<text x="51" y="345" font-size="23">借阅安排 C-1</text>
<path d="M231 338 L325 193 H600" fill="none" stroke="#407570" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="374" y="178" width="148" height="28" rx="12" fill="#fcfaf4"/>
<text x="381" y="199" font-size="19">属于类型</text>
<rect x="611" y="172" width="256" height="43" rx="12" fill="#f3e2bc"/>
<text x="629" y="200" font-size="19">服务安排</text>
<path d="M231 338 L325 248 H600" fill="none" stroke="#407570" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="374" y="233" width="148" height="28" rx="12" fill="#fcfaf4"/>
<text x="381" y="254" font-size="19">适用馆区</text>
<rect x="611" y="227" width="256" height="43" rx="12" fill="#f3e2bc"/>
<text x="629" y="255" font-size="19">之江馆区</text>
<path d="M231 338 L325 303 H600" fill="none" stroke="#407570" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="374" y="288" width="148" height="28" rx="12" fill="#fcfaf4"/>
<text x="381" y="309" font-size="19">涉及服务</text>
<rect x="611" y="282" width="256" height="43" rx="12" fill="#f3e2bc"/>
<text x="629" y="310" font-size="19">借阅</text>
<path d="M231 338 L325 358 H600" fill="none" stroke="#407570" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="374" y="343" width="148" height="28" rx="12" fill="#fcfaf4"/>
<text x="381" y="364" font-size="19">适用日期</text>
<rect x="611" y="337" width="256" height="43" rx="12" fill="#f3e2bc"/>
<text x="629" y="365" font-size="19">11 月 15 日</text>
<path d="M231 338 L325 413 H600" fill="none" stroke="#407570" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="374" y="398" width="148" height="28" rx="12" fill="#fcfaf4"/>
<text x="381" y="419" font-size="19">停止受理时间</text>
<rect x="611" y="392" width="256" height="43" rx="12" fill="#f3e2bc"/>
<text x="629" y="420" font-size="19">16:30</text>
<path d="M231 338 L325 468 H600" fill="none" stroke="#407570" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="374" y="453" width="148" height="28" rx="12" fill="#fcfaf4"/>
<text x="381" y="474" font-size="19">依据</text>
<rect x="611" y="447" width="256" height="43" rx="12" fill="#f3e2bc"/>
<text x="629" y="475" font-size="19">周末服务公告第 1 段</text>
<rect x="22" y="510" width="856" height="168" rx="12" fill="#e6eee8"/>
<text x="44" y="548" font-size="25">按“先办证、再借书”查询</text>
<text x="44" y="586" font-size="19">D 支持携带本人有效身份证件原件；C 支持当天借阅截止于 16:30。</text>
<text x="44" y="619" font-size="19">B 的 17:00 是场馆关闭时间。办证截止时间和办理耗时仍缺证据。</text>
<text x="44" y="652" font-size="19">因此，首次办证后还能借到书的最晚到馆时间待确认。</text>
</svg>