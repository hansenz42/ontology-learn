<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">入库前，逐项对照原件</title><desc id="desc">这次保留四份全文；下一节再给它们建索引。</desc><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="960" height="500" rx="14" fill="#faf6ee"/><text x="38" y="42" font-size="17" font-weight="600" fill="#8b4c37">嘉宾资料手记   /   教学示例</text><text x="38" y="90" font-size="34" font-weight="700" fill="#193e40">入库前，逐项对照原件</text><text x="38" y="128" font-size="20" font-weight="400" fill="#193e40">这次保留四份全文；下一节再给它们建索引。</text><rect x="38" y="149" width="884" height="56" rx="14" fill="#e0ece6"/><text x="58" y="185" font-size="22" font-weight="600" fill="#193e40">01   登记来源</text><text x="346" y="185" font-size="21" font-weight="400" fill="#193e40">分别记录 A–D 的作者、标题和版本。</text><rect x="38" y="216" width="884" height="56" rx="14" fill="#fff"/><text x="58" y="252" font-size="22" font-weight="600" fill="#193e40">02   保留结构</text><text x="346" y="252" font-size="21" font-weight="400" fill="#193e40">让 D 的题目和答语相邻。</text><rect x="38" y="283" width="884" height="56" rx="14" fill="#e0ece6"/><text x="58" y="319" font-size="22" font-weight="600" fill="#193e40">03   清理杂项</text><text x="346" y="319" font-size="21" font-weight="400" fill="#193e40">保留 C 的“前几年”和 B 的问卷名。</text><rect x="38" y="350" width="884" height="56" rx="14" fill="#fff"/><text x="58" y="386" font-size="22" font-weight="600" fill="#193e40">04   决定分片</text><text x="346" y="386" font-size="21" font-weight="400" fill="#193e40">短资料各留整篇；长问卷可按问答对拆。</text><rect x="38" y="417" width="884" height="56" rx="14" fill="#e0ece6"/><text x="58" y="453" font-size="22" font-weight="600" fill="#193e40">05   回查原件</text><text x="346" y="453" font-size="21" font-weight="400" fill="#193e40">从整理稿定位到对应版本和原句。</text></g></svg>
